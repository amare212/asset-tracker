
server:
  port: 8082

spring:
  application:
    name: asset-tracker
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/asset_tracker_api_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000
  admin:
    username: ${ADMIN_USERNAME}
    password: ${ADMIN_PASSWORD}
